<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" role="img" aria-label="Jordi Tarroch — Investment Principal · Quantitative Finance · New York" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="bg" cx="28%" cy="35%" r="100%">
      <stop offset="0%" stop-color="#141d30"/>
      <stop offset="58%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090c11"/>
    </radialGradient>

    <!-- flowing gradient that slides along the signal -->
    <linearGradient id="sig" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0%"  stop-color="#5DCAA5"/>
      <stop offset="35%" stop-color="#85B7EB"/>
      <stop offset="70%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-520 0" to="520 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- highlight sweep across the name -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="300" y2="0">
      <stop offset="0%"  stop-color="#dce6f2"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce6f2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-260 0" to="560 0" dur="6.5s" begin="1.4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#85B7EB" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#85B7EB" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#85B7EB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9fd8ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#85B7EB" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <path id="curve" d="M 60 238 C 140 230 180 252 240 232 S 340 188 400 200 S 500 232 560 194 S 660 128 720 150 S 820 182 880 138 S 980 78 1040 95 S 1120 86 1148 70"/>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>

  <g clip-path="url(#frame)">

    <!-- parallax grid: drifts slowly -->
    <g stroke="#1b2230" stroke-width="1">
      <g>
        <line x1="0" y1="75" x2="1200" y2="75"/>
        <line x1="0" y1="150" x2="1200" y2="150"/>
        <line x1="0" y1="225" x2="1200" y2="225"/>
        <line x1="150" y1="0" x2="150" y2="300"/>
        <line x1="450" y1="0" x2="450" y2="300"/>
        <line x1="750" y1="0" x2="750" y2="300"/>
        <line x1="1050" y1="0" x2="1050" y2="300"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="24s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- drifting particle field -->
    <g fill="#9fb4d4">
      <circle cx="120" cy="270" r="1.4" opacity="0"><animate attributeName="cy" values="270;-10" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="290" r="1.1" opacity="0"><animate attributeName="cy" values="290;-10" dur="11s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.45;0" dur="11s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="280" r="1.6" opacity="0"><animate attributeName="cy" values="280;-10" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="10s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="295" r="1.2" opacity="0"><animate attributeName="cy" values="295;-10" dur="12s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.4;0" dur="12s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="285" r="1.5" opacity="0"><animate attributeName="cy" values="285;-10" dur="9.5s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="9.5s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="292" r="1.2" opacity="0"><animate attributeName="cy" values="292;-10" dur="11.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.45;0" dur="11.5s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="288" r="1.3" opacity="0"><animate attributeName="cy" values="288;-10" dur="10.5s" begin="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.4;0" dur="10.5s" begin="5.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sweeping scan beam -->
    <g>
      <rect x="-160" y="0" width="160" height="300" fill="url(#beam)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1360 0" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- the noise: faint, jagged, going nowhere -->
    <polyline points="60,235 110,244 160,228 210,246 260,232 310,242 360,226 410,243 460,230 510,244 560,229 610,241 660,228 710,244 760,231 810,242 860,227 910,243 960,230 1010,241 1060,229 1110,240 1150,232"
              fill="none" stroke="#3a4254" stroke-width="1.2" opacity=".5">
      <animate attributeName="opacity" values=".5;.22;.5" dur="6s" repeatCount="indefinite"/>
    </polyline>

    <!-- ensemble of candidate models: faint curves resolving into the signal -->
    <g fill="none" stroke="#4a6a8f" stroke-width="1.4" opacity="0">
      <path d="M 60 240 C 150 250 200 210 260 224 S 360 250 420 214 S 520 178 580 210 S 680 150 740 176 S 840 150 900 124 S 1000 108 1148 88">
        <animate attributeName="opacity" values="0;.35;.35;0" keyTimes="0;.25;.7;1" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M 60 236 C 150 224 200 256 260 240 S 360 196 420 188 S 520 216 580 182 S 680 138 740 158 S 840 168 900 146 S 1000 92 1148 80">
        <animate attributeName="opacity" values="0;.3;.3;0" keyTimes="0;.25;.7;1" dur="11s" begin="1.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- soft area under the signal -->
    <path d="M 60 238 C 140 230 180 252 240 232 S 340 188 400 200 S 500 232 560 194 S 660 128 720 150 S 820 182 880 138 S 980 78 1040 95 S 1120 86 1148 70 L 1148 300 L 60 300 Z"
          fill="url(#fade)" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.55;.85;1" dur="11s" repeatCount="indefinite"/>
    </path>

    <!-- the signal: drawn out of the noise, forever -->
    <use href="#curve" xlink:href="#curve" fill="none" stroke="url(#sig)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"
         stroke-dasharray="1500" stroke-dashoffset="1500">
      <animate attributeName="stroke-dashoffset" values="1500;0;0;1500" keyTimes="0;.55;.82;1" dur="11s" repeatCount="indefinite"/>
    </use>

    <!-- the packet: races along the signal, tick-to-trade -->
    <g>
      <circle r="7" fill="#bfe6ff" opacity=".5" filter="url(#soft)">
        <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#curve" xlink:href="#curve"/></animateMotion>
      </circle>
      <circle r="3" fill="#ffffff" filter="url(#glow)">
        <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#curve" xlink:href="#curve"/></animateMotion>
      </circle>
    </g>

    <!-- data points waking up along the signal -->
    <g fill="#85B7EB">
      <circle cx="400" cy="200" r="3"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.8;1" dur="11s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="194" r="3" fill="#5DCAA5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.8;1" dur="11s" begin="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="150" r="3"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.8;1" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="138" r="3" fill="#5DCAA5"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.8;1" dur="11s" begin="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="95" r="3"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.3;.8;1" dur="11s" begin="5.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- the live edge: pulsing halo where the signal ends -->
    <g>
      <circle cx="1148" cy="70" r="5" fill="#AFA9EC" filter="url(#glow)">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.6;.85;1" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1148" cy="70" r="5" fill="none" stroke="#AFA9EC" stroke-width="1.5">
        <animate attributeName="r" values="5;24" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1148" cy="70" r="5" fill="none" stroke="#9fd8ff" stroke-width="1.2">
        <animate attributeName="r" values="5;24" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1148" cy="70" r="30" fill="none" stroke="#AFA9EC" stroke-width="1" stroke-dasharray="4 7" opacity=".55">
        <animateTransform attributeName="transform" type="rotate" from="0 1148 70" to="360 1148 70" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <g>
      <text x="76" y="128" font-size="54" font-weight="650" fill="url(#nameGrad)" letter-spacing="0.5">Jordi Tarroch
        <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
      </text>
      <text x="78" y="166" font-size="20" fill="#9aa4b2" letter-spacing="2.5">INVESTMENT PRINCIPAL · QUANTITATIVE FINANCE · NEW YORK
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;.4;1" dur="2.4s" fill="freeze"/>
      </text>
      <text x="78" y="200" font-size="13" fill="#6e7a8a" letter-spacing="1.2">signal · from · noise
        <animate attributeName="opacity" values="0;0;.9" keyTimes="0;.6;1" dur="3.2s" fill="freeze"/>
      </text>
    </g>

  </g>
</svg>
